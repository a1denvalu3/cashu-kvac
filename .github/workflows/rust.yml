name: Rust CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          override-with: cargo
          components: rustfmt, clippy, 

      - name: Format code
        run: cargo fmt -- --check

      - name: Lint code
        run: cargo clippy --examples -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Run documentation examples
        run: |
          cargo run --locked --example attributes
          cargo run --locked --example issuance
          cargo run --locked --example swap
      
      - name: Add wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown
      
      - name: Build wasm32-unknown-unknown target
        run: cargo build --target wasm32-unknown-unknown --release
